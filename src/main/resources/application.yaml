spring:
  application:
    name: netpulse

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/netpulse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:netpulse}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:false}

  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

netpulse:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    admin: ${MAIL_ADMIN:${MAIL_USERNAME:}}

  service:
    url: ${NETPULSE_SERVICE_URL:http://168.107.19.179:8080}

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

kakao:
  api:
    key: ${KAKAO_REST_API_KEY:}
  oauth:
    redirect-uri: ${KAKAO_REDIRECT_URI:http://168.107.19.179:8080/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  token:
    access-token: ${KAKAO_ACCESS_TOKEN:}
    refresh-token: ${KAKAO_REFRESH_TOKEN:}
    access-token-url: ${KAKAO_ACCESS_TOKEN_URL:https://kauth.kakao.com/oauth/token}
    refresh-token-url: ${KAKAO_REFRESH_TOKEN_URL:https://kauth.kakao.com/oauth/token}
    message:
      url: ${KAKAO_MESSAGE_URL:https://kapi.kakao.com/v2/api/talk/memo/default/send}

logging:
  level:
    com.netpulse: ${LOG_LEVEL_NETPULSE:INFO}
