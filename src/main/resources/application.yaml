spring:
  application:
    name: netpulse

  # MariaDB 설정
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/netpulse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: netpulse
    password: no1Wjdqh!!

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: false

  # Thymeleaf 설정
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

# 서버 포트
server:
  port: 8080

# 카카오 알림톡 설정
kakao:
  api:
    key: ${KAKAO_REST_API_KEY}
  oauth:
    redirect-uri: http://localhost:8080/kakao/callback
    client-secret: ${KAKAO_CLIENT_SECRET:}
  message:
    url: https://kapi.kakao.com/v2/api/talk/memo/default/send

# 로그 설정
logging:
  level:
    com.netpulse: INFO
